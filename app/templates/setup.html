{% extends "base.html" %}
{% block title %}First-time setup{% endblock %}
{% block content %}
<div class="auth-card card mx-auto">
  <div class="card-body">
    <h1 class="h4">Create the administrator account</h1>
    <p class="text-secondary small">The one-time setup token is printed in the container log. Run
      <code>docker compose logs app | grep setup_token</code> to see it.</p>
    {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/setup">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <div class="mb-3">
        <label class="form-label" for="token">Setup token</label>
        <input class="form-control" id="token" name="token" autocomplete="off" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" value="{{ username or '' }}" autocomplete="username" minlength="3" maxlength="60" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password (at least 12 characters)</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm">Repeat password</label>
        <input class="form-control" id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <button class="btn btn-primary w-100">Create account</button>
    </form>
  </div>
</div>
{% endblock %}
